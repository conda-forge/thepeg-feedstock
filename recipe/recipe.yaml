context:
  version: "2.3.0"

package:
  name: thepeg
  version: ${{ version }}

source:
  url: https://thepeg.hepforge.org/downloads/ThePEG-${{ version }}.tar.bz2
  sha256: ac35979ae89c29608ca92c156a49ff68aace7a5a12a0c92f0a01a833d2d34572
  patches:
    - fix-libtool-darwin-allow-undefined-flag-for-macOS-11.patch
    - fix-C-17-compatibility-of-Config-std.h-with-libc.patch
    - remove-whitespace-in-literal-operator-declarations.patch
    - fix-hardcoded-install-paths-for-relocated-prefixes.patch
    - fix-thepeg-config-exit-status-and-use-grep-E.patch
    # TODO: Drop after move to a release with Rivet 4 support (patch is a backport)
    - add-support-for-Rivet-4.patch

build:
  number: 3
  skip:
    - win
  script:
    # Get an updated config.sub and config.guess
    # c.f. https://conda-forge.org/docs/how-to/advanced/cross-compilation/#autotools
    # ThePEG sets AC_CONFIG_AUX_DIR([Config]) in configure.ac, so configure looks for them in Config/
    - cp $BUILD_PREFIX/share/gnuconfig/config.* ./Config
    # Rivet is built against HepMC3, and ThePEG passes its HepMC events directly to Rivet,
    # so ThePEG has to use HepMC3 as well (configure defaults to HepMC2)
    - ./configure --prefix=${PREFIX} --with-fastjet=${PREFIX} --with-gsl=${PREFIX} --with-hepmc=${PREFIX} --with-hepmcversion=3 --with-lhapdf=${PREFIX} --with-rivet=${PREFIX} --with-boost=${PREFIX}
    - make -j${CPU_COUNT} CXX=$CXX
    - make check
    - make install
    - rm -rf "${PREFIX}/lib/ThePEG/Makefile" "${PREFIX}/lib/ThePEG/Makefile.common" "${PREFIX}/share/ThePEG/Doc"
    - rm -f "${PREFIX}/lib/ThePEG/runThePEG-${{ version }}" "${PREFIX}/lib/ThePEG/setupThePEG-${{ version }}"

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler("cxx") }}
    - gnuconfig
    - make
    - time
  host:
    - fastjet-cxx  # pick up global pinning
    - fastjet-cxx-devel
    - gsl
    - hepmc3
    - lhapdf
    - libboost-devel
    - rivet
    - zlib
  run:
    # thepeg-config --fastjet-include/--fastjet-libs point at FastJet headers and link libraries
    - fastjet-cxx-devel
    # thepeg-config parses its options with grep
    - grep
  run_exports:
    - ${{ pin_subpackage("thepeg", upper_bound="x.x") }}

tests:
  - package_contents:
      bin:
        - runThePEG
        - setupThePEG
        - thepeg-config
      include:
        - ThePEG/*/*
      # Use files over lib as lib globs get the platform shared library extension
      # appended, but the libtool '-module' plugins are named .so on macOS as well
      files:
        # Guard against FastJet support being silently disabled at configure time
        - lib/ThePEG/FastJetFinder.so
        # Guard against Rivet support being silently disabled at configure time
        - lib/ThePEG/RivetAnalysis.so
        - lib/ThePEG/*.so
        - if: linux
          then: lib/ThePEG/*.so.*
        - if: osx
          then: lib/ThePEG/*.dylib
        - lib/ThePEG/ThePEGDefaults-${{ version }}.rpo
        - lib/ThePEG/ThePEGDefaults.rpo
        - share/*
        - etc/conda/test-files/thepeg/*
      strict: true

  - script:
      - thepeg-config --help
      - thepeg-config --prefix
      - thepeg-config --datadir
      - thepeg-config --libdir
      - thepeg-config --includedir
      - thepeg-config --cppflags
      - thepeg-config --ldflags
      - thepeg-config --ldlibs
      - thepeg-config --rivet-include
      - thepeg-config --fastjet-include
      - thepeg-config --rivet-libs
      - thepeg-config --fastjet-libs

      - runThePEG --version
      - test -f "$(thepeg-config --fastjet-include | sed 's/^-I//')/fastjet/ClusterSequence.hh"
      # Load RivetAnalysis.so and run a Rivet analysis in-process end to end
      - setupThePEG --exitonerror test_rivet.in
      - runThePEG RivetTest.run
      - grep "/MC_XS/" RivetTest.yoda
    requirements:
      run:
        - sed
    files:
      recipe:
        - test_rivet.in

about:
  homepage: https://thepeg.hepforge.org/
  summary: 'Toolkit for High Energy Physics Event Generation - ThePEG'
  description: |
    ThePEG is a general toolkit for implementing physics models of event generation in high energy
    particle collisions. It defines a general structure of event generation in terms of abstract base
    classes like hard partonic matrix elements, parton showers and the decay of unstable particles.
  license: GPL-3.0-or-later
  license_file: COPYING
  documentation: https://thepeg.hepforge.org/doxygen/
  repository: https://repo.hepforge.org/source/thepeghg/

extra:
  recipe-maintainers:
    - utk4r-sh
    - GiacomoXT
    - vvsagar
    - AlexanderHeidelbach
    - conda-forge/hepmc3
